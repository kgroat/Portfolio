name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # oxfmt, oxlint, tsc and vitest
      - run: pnpm check
      - run: pnpm build
      # Boots the production server and checks every route, including the PDF.
      - run: pnpm smoke
